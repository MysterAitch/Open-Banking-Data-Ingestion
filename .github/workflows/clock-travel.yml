# The suite, run as if it were some other date.
#
# It exists because of a defect that had nothing to do with the change that
# exposed it: a fixture carrying the day's date passed for a week, then failed a
# build of a commit that had passed six hours earlier on identical content. The
# attempt it described had aged past a seven-day filter, so the row it drew
# vanished. Nothing was flaky, and re-running would have "worked" for six hours.
#
# A fixture with a literal date is not the defect - a fixed date compared against
# another fixed date is stable forever, and clearer than a computed one. The defect
# is a literal measured against NOW, and that is not visible by reading, only by
# moving the clock. So this moves the clock.
#
# NOT on every push. A failure here is a latent bomb rather than a regression in
# the change under review, so blocking a pull request on somebody else's expiring
# fixture would refuse correct work - the failure mode that gets a gate switched
# off. It runs weekly, and on demand when somebody wants an answer now.
name: clock travel

on:
  schedule:
    # Early Monday, so a week's work is reviewed against the horizon before the
    # next week's starts on top of it.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Days into the future to run the suite (offset legs only)"
        required: false
        default: "365"

jobs:
  travel:
    runs-on: ubuntu-latest
    strategy:
      # Every leg runs even when an earlier one fails: "it breaks at 31 days and
      # again at a year" says how urgent it is, and "something breaks" does not.
      fail-fast: false
      matrix:
        # Two kinds of destination, because they reach different faults.
        #
        # OFFSETS catch things that EXPIRE. Ageing out is monotonic - a fixture
        # outside a seven-day filter at 31 days is still outside it at a year - so
        # these do not repeat one another; they differ by the window LENGTH they
        # can reach. The long one is deliberately awkward rather than round: ten
        # years and change puts several annual boundaries behind it, the part-year
        # lands in a different month of the year, and the trailing days shift the
        # day of the month and the day of the week too. One leg, several
        # anticipated thresholds - and if it trips, which one it was becomes the
        # investigation rather than the assumption.
        #
        # ABSOLUTE destinations catch calendar FEATURES, which no offset can reach
        # reliably: where an offset lands depends on the day it was launched, so it
        # can only arrive on a leap day or a clock change by coincidence. They are
        # also reproducible - the same leg means the same instant every week.
        include:
          - { label: "tomorrow", days: 1 }
          - { label: "a month", days: 31 }
          - { label: "a quarter", days: 90 }
          - { label: "a year", days: 365 }
          - { label: "ten years and a bit", days: 3928 }
          - { label: "leap day", to: "2028-02-29T12:00:00Z" }
          - { label: "the last hour of a year", to: "2027-12-31T23:30:00Z" }
          # The two UK clock changes, verified against the calendar rather than
          # assumed: the last Sunday of March and of October 2027. Times chosen to
          # sit inside the hour that repeats or never happens.
          - { label: "clocks go forward", to: "2027-03-28T00:30:00Z" }
          - { label: "clocks go back", to: "2027-10-31T01:30:00Z" }
          # A 31st, with a 28-day month next. Naive "same day next month"
          # arithmetic fails here and nowhere else.
          - { label: "month end before a short month", to: "2027-01-31T12:00:00Z" }
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --quiet -e ".[dev]"

      # The instrument has to be shown capable of firing, or a clean sweep is not
      # evidence of anything. This runs FIRST: it asserts the clock actually moved
      # to where this leg said, so a no-op probe cannot report green across the
      # whole matrix. Running it after the suite would let a whole green run be
      # reported before anybody learned it meant nothing.
      - name: Confirm the clock actually moved
        env:
          OBDI_TRAVEL_DAYS: ${{ matrix.days }}
          OBDI_TRAVEL_TO: ${{ matrix.to }}
        run: python -m pytest -q -p conftest_timetravel tests/test_clock_travel_probe.py

      - name: Run the suite at ${{ matrix.label }}
        env:
          OBDI_TRAVEL_DAYS: ${{ matrix.days }}
          OBDI_TRAVEL_TO: ${{ matrix.to }}
        run: python -m pytest -q -p conftest_timetravel
