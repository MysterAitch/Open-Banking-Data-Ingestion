# LOCAL DEVELOPMENT ONLY - builds from source in this working tree.
#
# For a permanent deployment, keep the stack definition outside this repo and
# have it pull the image CI publishes rather than building on the host. That
# split is worth the extra step: the host runs things rather than compiling
# them, a broken build fails in CI instead of during a deploy, and a published
# tag is something update-watching can actually compare against.
#
# Use this file to run the stack against uncommitted changes. Do not deploy it.

services:
  obdi-web:
    build: .
    image: obdi:local
    container_name: obdi-web
    restart: unless-stopped
    ports:
      # Loopback only. This page can start a bank authorisation, so it must not
      # answer to anything that merely reaches the host. Reach it from a phone
      # with whatever you already use for private access, rather than by
      # widening this binding.
      - "127.0.0.1:8087:8080"
    volumes:
      - /srv/appdata/obdi/data:/data
      # Read-only: the container reads token files and must never rewrite one.
      - /srv/appdata/obdi/secrets:/secrets:ro
      # Refresh tokens, written as they rotate. Separate from /data because
      # that volume is meant to be freely copied, backed up and queried, and
      # bank credentials must not travel with every copy of it.
      - /srv/appdata/obdi/credentials:/credentials
    environment:
      TZ: Europe/London
      # Point the app at the mounted volumes - there is no fallback: `serve`
      # refuses to start without a connection store, and an unset DB path
      # writes inside the container and is lost on recreate.
      OBDI_DB_PATH: /data/store.sqlite3
      OBDI_ACCOUNT_MAP: /data/accounts.json
      OBDI_CONNECTION_STORE: /credentials/connections.json
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID}
      TRUELAYER_CLIENT_SECRET_FILE: /secrets/truelayer-client-secret
      # Must match a redirect URI registered with the provider byte for byte.
      # The externally reachable hostname of this service, NOT localhost.
      TRUELAYER_REDIRECT_URI: ${TRUELAYER_REDIRECT_URI}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8080/').status_code==200 else 1)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s

  obdi-pull:
    build: .
    image: obdi:local
    container_name: obdi-pull
    restart: unless-stopped
    depends_on:
      - obdi-web
    volumes:
      - /srv/appdata/obdi/data:/data
      - /srv/appdata/obdi/secrets:/secrets:ro
      # Without this mount the scheduler cannot see any stored connection and
      # is structurally Starling-only, whatever the loop below says.
      - /srv/appdata/obdi/credentials:/credentials
    environment:
      TZ: Europe/London
      # Identical to obdi-web on purpose: both operate on ONE store, and a
      # divergence means the puller fills a database the web page never reads.
      OBDI_DB_PATH: /data/store.sqlite3
      OBDI_ACCOUNT_MAP: /data/accounts.json
      OBDI_CONNECTION_STORE: /credentials/connections.json
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID}
      TRUELAYER_CLIENT_SECRET_FILE: /secrets/truelayer-client-secret
      STARLING_PERSONAL_ACCESS_TOKEN_FILE: /secrets/starling-token
      # Six hours because that is what the banks permit: many cap unattended
      # data fetches at four a day, and the aggregator's own polling runs on
      # the same cycle. Polling harder buys nothing and risks a rate limit.
      OBDI_PULL_INTERVAL_SECONDS: "21600"
      # Labels every artefact this container lands as scheduler-driven.
      OBDI_TRIGGER: scheduled
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Bare `obdi pull` fetches EVERY stored connection plus Starling when a
      # token is configured. Not a configured list of names: a list drifts from
      # the connection store the moment a bank is authorised, and drifts
      # silently - the loop keeps succeeding at the names it was given while
      # the new bank is never fetched.
      - |
        while true; do
          obdi pull || echo "pull failed, continuing"
          obdi pair-transfers || true
          sleep "$${OBDI_PULL_INTERVAL_SECONDS}"
        done
