# Where every module of `src/obdi` goes: `old module = "new module"`, both dotted and relative to
# `obdi`. One table per package, and the tables are the steps of the move, run in `order`
# (`move.py <step>`): every package already moved depends only on packages moved before it.
#
# The assignment is `plan.md`'s ("Every module, assigned"), with the owner's decisions of
# 2026-10-07 applied: seven packages, the 21 read models of the old `analysis` in `read` and only
# `recurring` and `categorise` left in `analysis`, and `ingest.py` renamed `pipeline` because
# `obdi/ingest.py` and `obdi/ingest/` cannot coexist. The direction is
#
#     core <- ingest <- verify <- read <- analysis <- export <- pages
#
# (`export` beside `analysis` in the plan's drawing; ranked above it so that export may read
# analysis and analysis may not read export; `pages` above both). `cli` stays at the package root
# as the composition root, and the root `__init__` stays with it; neither is listed.
#
# `parsers` and `providers` move whole, inside `ingest`, keeping their own names.
# `providers` has no `__init__.py` today and gets none.

order = ["core", "ingest", "verify", "read", "analysis", "export", "pages"]

# What each package's `__init__.py` says of it, written when the package is created.
[describes]
core = "What every layer uses: records, money, masking primitives, logs, errors, namespaces, plurals, the London clock, and the vocabulary pages and checks share."
ingest = "Landing and deriving: providers, parsers, the store, rebuild, extraction, matching, identity, the raw layer, and the derive-time rules that rebuild cannot run without."
verify = "Judging what is held: agreement, standing, protection, known balances, statements, spans, reconciliation, and the measurements of those."
read = "The read models the pages show: ledger, overview, position, to-do, charts, timelines, and what to fetch next."
analysis = "What is derived from verified data beyond the read models: the recurring-payment detector and categorisation."
export = "Actual: the push, the audit, the verdict, the replay, and the declared-layer export."
pages = "Every web page, navigation, the stylesheets, the handler, and the page chrome."

