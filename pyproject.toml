[project]
name = "obdi"
version = "0.1.0"
description = "Open banking data ingestion - canonical local store, app-agnostic"
requires-python = ">=3.11"
# Floors track the versions this project is actually tested against, so a
# fresh resolve cannot silently pick something years old. Exact pins for a
# reproducible install live in requirements.txt.
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[project.scripts]
obdi = "obdi.cli:main"

[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obdi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
