[project]
name = "obdi"
version = "0.4.366"
description = "Open banking data ingestion - canonical local store, app-agnostic"
requires-python = ">=3.11"
# Floors track the versions this project is actually tested against, so a
# fresh resolve cannot silently pick something years old. Exact pins for a
# reproducible install live in requirements.txt.
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13",
    "python-dotenv>=1.2.2",
    "pypdf>=6.15",
    # Word-level geometry. pypdf reads text but reconstructs columns from
    # whitespace and coalesces a line into a single fragment, which loses
    # the positions a wide statement needs; pdfplumber reports each word's
    # own coordinates. Both are kept: the two readings of a page
    # disagreeing is how a fused field gets noticed.
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    # Runs the suite across processes. One process took 8.5 minutes, and a
    # release runs the suite before it will push.
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "mypy>=2.3",
    # Drives the pages in a real browser. Every fault in the upload flow
    # that reached use was one only eyes catch - a tap target too small, a
    # summary that read as a wall, a count wrong on the screen, a section
    # that silently vanished - and none could fail a test that never
    # rendered anything. NOT a runtime dependency: it also needs a browser
    # downloaded separately (`playwright install chromium`), so a plain
    # `pip install .` must never pull it.
    "playwright>=1.62",
    # Moves the clock so the suite can be run as if it were months from now. The
    # defect it hunts is invisible to reading: a fixture carrying a literal date,
    # measured against a window that starts at the current time, which passes
    # until the day it silently stops. Optional at runtime and skipped when
    # absent, so a plain `pip install .` never pulls it and the suite still runs
    # without it - only the probe's own self-check goes quiet, and it says so.
    "time-machine>=2.19",
    # Runs the package split under docs/design/2026-10-layers/move.py. A lossless syntax
    # tree, so the codemod rewrites import statements and module-path strings and nothing
    # else, and a second run over its own result changes nothing. Used by that script only;
    # never imported by the application or the suite.
    "libcst>=1.8",
]

[project.scripts]
obdi = "obdi.cli:main"

[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obdi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/core", "tests/ingest", "tests/verify", "tests/read", "tests/analysis", "tests/export", "tests/cli", "tests/pages"]
# A misspelt marker is an error, not a test that nobody selects. A test file's layer marker is
# the name of the directory it lives in under tests/, applied once in tests/conftest.py, and
# the directories mirror the packages of src/obdi; docs/BUILDING.md says how to select them.
addopts = "--strict-markers"
markers = [
    "core: records, money, masking, logs, errors, the clock, and the shared page vocabulary",
    "ingest: providers, parsers, the store, rebuild, extraction, matching, identity",
    "verify: agreement, standing, trust, coverage, statements, spans, protection, balances",
    "read: the read models the pages show - ledger, overview, position, to-do, charts, timelines",
    "analysis: the recurring detector, categorisation, entities, and what the commitments phase adds",
    "export: Actual, the push, audit, verdict, replay, and the declared-layer export",
    "pages: every web page, navigation, stylesheets, layout and scale, page wording",
    "cli: tests that drive the command line and so reach every layer",
    "guards: cross-cutting tests every change must pass, whatever layer it touched",
    "slow: builds the large stores; leave out of a quick pass with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tests/core", "tests/ingest", "tests/verify", "tests/read", "tests/analysis", "tests/export", "tests/cli", "tests/pages"]
# The scripts under docs/design are the record of a design exercise: they made the prototype
# pages that sit beside them and are kept as they were written, not maintained as project code.
# Holding them to these rules stopped a release at the lint gate with 91 findings in three files.
extend-exclude = ["docs/design"]

[tool.ruff.lint]
# Several review findings were exactly the classes these families catch, which
# is a better argument for them than any style preference: naive datetime
# handling, a bare except swallowing a failure, and a path built by string
# concatenation.
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "ANN",   # missing annotations - the entry point for type checking
    "S",     # common security mistakes
    "DTZ",   # naive datetimes; every timestamp here must carry a zone
    "PTH",   # pathlib over os.path
    "RUF",   # ruff's own checks
    "C4",    # comprehension clarity
    "RET",   # return-flow clarity
]
ignore = [
    "ANN401",  # deliberate: `object` is used as the unknown type, never Any
    "S101",    # assert is how tests express intent
]

[tool.ruff.lint.per-file-ignores]
# Tests describe scenarios rather than expose an API, and their fixtures are
# self-evidently typed by what they return.
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "S105", "S106"]
# These import a fixture from a sibling test module, and a test naming it as a
# parameter reads to the linter as redefining the import. That is how pytest
# shares a fixture without a conftest holding the scenario's helpers.
"tests/**/test_overview*.py" = ["F811"]
"tests/**/test_scheduler_phone_layout.py" = ["F811"]
# Scripts are operator tools run by hand, not a library surface.
"scripts/*" = ["ANN001", "ANN201", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
# The point of the exercise: an untyped call or an implicit Any silently
# switches checking off for everything downstream of it, which is how a bare
# `dict` from a provider ends up flowing unchecked into stored money.
disallow_any_unimported = true
warn_unreachable = true
files = ["src/obdi"]

[[tool.mypy.overrides]]
# Tests exercise deliberately malformed inputs, so they type-check loosely on
# purpose - a test proving a wrong type is refused must be able to pass one.
module = "tests.*"
ignore_errors = true
